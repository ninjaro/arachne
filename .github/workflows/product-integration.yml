name: Product inbox application

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: product-database-write
  cancel-in-progress: false

jobs:
  apply-inbox:
    if: vars.ARACHNE_OPERATIONS_ENABLED == 'true'
    runs-on: ${{ vars.ARACHNE_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            nlohmann-json3-dev

      - name: Build Arachne
        env:
          ARACHNE_BUILD_TESTS: "OFF"
          ARACHNE_BUILD_LEGACY_CLIENT: "OFF"
        run: scripts/build.sh

      - name: Validate strict inbox batches
        run: build/arachne product check-inbox

      - name: Apply strict inbox batches
        run: build/arachne product apply-inbox

      - name: Detect product changes
        id: product
        run: |
          if git diff --quiet -- database/art-islands.sqlite; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rebuild merge hints for review export
        if: steps.product.outputs.changed == 'true'
        run: build/arachne product rebuild-merge-hints

      - name: Export review hints and compact derived state
        if: steps.product.outputs.changed == 'true'
        run: |
          python3 scripts/compact_merge_hints.py \
            database/art-islands.sqlite \
            database/merge-hints-review.json \
            --minimum-score 0.65 \
            --per-type 500 \
            --per-entity 5 \
            --report "${RUNNER_TEMP}/merge-hints-compaction.json"

      - name: Add compaction summary
        if: steps.product.outputs.changed == 'true'
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "merge-hints-compaction.json")
              .read_text(encoding="utf-8")
          )
          before = report["before"]["bytes"]
          after = report["after"]["bytes"]
          print("## Merge hint compaction")
          print()
          print(f"- Review items: {report['reviewItems']}")
          print(f"- Database before: {before} bytes")
          print(f"- Database after: {after} bytes")
          print(f"- Reduction: {before - after} bytes")
          print("- Integrity check: ok")
          print("- Foreign key check: ok")
          PY

      - name: Propose the database change for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/propose_state_change.py \
            --state-root "${GITHUB_WORKSPACE}" \
            --repository "${GITHUB_REPOSITORY}" \
            --base "${{ github.event.repository.default_branch }}" \
            --branch "arachne/inbox-${GITHUB_RUN_ID}" \
            --title "Apply Arachne inbox batches" \
            --body "Applied validated arachne_batch_v2 files from inbox/ in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
