name: Publish Arachne viewer

on:
  workflow_dispatch:
    inputs:
      product_export:
        description: Product export path inside the state repository
        required: true
        type: string
      product_snapshot_id:
        description: Product snapshot identifier
        required: true
        type: string
      candidate_export:
        description: Optional candidate export path inside the state repository
        required: false
        type: string
      candidate_snapshot_id:
        description: Required when candidate_export is supplied
        required: false
        type: string
  workflow_call:
    inputs:
      product_export:
        required: true
        type: string
      product_snapshot_id:
        required: true
        type: string
      candidate_export:
        required: false
        type: string
      candidate_snapshot_id:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arachne-viewer-pages
  cancel-in-progress: false

jobs:
  build-site:
    if: vars.ARACHNE_OPERATIONS_ENABLED == 'true'
    environment: arachne-publication
    runs-on: ${{ vars.ARACHNE_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent-state settings
        env:
          STATE_REPOSITORY: ${{ vars.ARACHNE_STATE_REPOSITORY }}
          STATE_BASE_BRANCH: ${{ vars.ARACHNE_STATE_BASE_BRANCH }}
          STATE_TOKEN: ${{ secrets.ARACHNE_STATE_TOKEN }}
        run: |
          test -n "${STATE_REPOSITORY}"
          test -n "${STATE_BASE_BRANCH}"
          test -n "${STATE_TOKEN}"
      - name: Checkout reviewed persistent state
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ARACHNE_STATE_REPOSITORY }}
          ref: ${{ vars.ARACHNE_STATE_BASE_BRANCH }}
          token: ${{ secrets.ARACHNE_STATE_TOKEN }}
          path: .arachne-state
          lfs: true
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Install application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            nlohmann-json3-dev
      - name: Build Arachne operations binary
        env:
          ARACHNE_BUILD_TESTS: "OFF"
          ARACHNE_BUILD_LEGACY_CLIENT: "OFF"
        run: scripts/build.sh
      - name: Materialize config and resolve reviewed exports
        env:
          PRODUCT_EXPORT_INPUT: ${{ inputs.product_export }}
          CANDIDATE_EXPORT_INPUT: ${{ inputs.candidate_export }}
        run: |
          python3 scripts/materialize_ci_config.py \
            --template "${GITHUB_WORKSPACE}/.arachne-state/config/arachne.json" \
            --state-root "${GITHUB_WORKSPACE}/.arachne-state" \
            --source-root "${GITHUB_WORKSPACE}" \
            --runner-temp "${RUNNER_TEMP}" \
            --output "${RUNNER_TEMP}/arachne-config.json"
          python3 -c 'import json,os; config=json.load(open(os.environ["RUNNER_TEMP"] + "/arachne-config.json")); print("ARACHNE_SITE=" + config["paths"]["site_output"])' >> "${GITHUB_ENV}"
          python3 -c 'import os,pathlib; root=pathlib.Path(os.environ["GITHUB_WORKSPACE"], ".arachne-state").resolve(strict=True); value=(root / os.environ["PRODUCT_EXPORT_INPUT"]).resolve(strict=True); value.relative_to(root); print("PRODUCT_EXPORT_PATH=" + str(value))' >> "${GITHUB_ENV}"
          if [[ -n "${CANDIDATE_EXPORT_INPUT}" ]]; then
            python3 -c 'import os,pathlib; root=pathlib.Path(os.environ["GITHUB_WORKSPACE"], ".arachne-state").resolve(strict=True); value=(root / os.environ["CANDIDATE_EXPORT_INPUT"]).resolve(strict=True); value.relative_to(root); print("CANDIDATE_EXPORT_PATH=" + str(value))' >> "${GITHUB_ENV}"
          fi
      - name: Build versioned static viewer
        id: viewer
        continue-on-error: true
        env:
          PRODUCT_SNAPSHOT_ID: ${{ inputs.product_snapshot_id }}
          CANDIDATE_SNAPSHOT_ID: ${{ inputs.candidate_snapshot_id }}
          CANDIDATE_EXPORT_INPUT: ${{ inputs.candidate_export }}
        run: |
          arguments=(
            --config "${RUNNER_TEMP}/arachne-config.json"
            --binary "${GITHUB_WORKSPACE}/build/arachne"
            viewer-build
            --product-export "${PRODUCT_EXPORT_PATH}"
            --product-snapshot-id "${PRODUCT_SNAPSHOT_ID}"
          )
          if [[ -n "${CANDIDATE_EXPORT_INPUT}" ]]; then
            test -n "${CANDIDATE_SNAPSHOT_ID}"
            arguments+=(
              --candidate-export "${CANDIDATE_EXPORT_PATH}"
              --candidate-snapshot-id "${CANDIDATE_SNAPSHOT_ID}"
            )
          else
            test -z "${CANDIDATE_SNAPSHOT_ID}"
          fi
          python3 scripts/arachne_ops.py "${arguments[@]}"
      - name: Stop after viewer failure
        if: steps.viewer.outcome != 'success'
        run: exit 1
      - name: Resolve and verify the active immutable bundle
        id: bundle
        run: |
          python3 scripts/resolve_site_bundle.py \
            --site-root "${ARACHNE_SITE}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.bundle.outputs.path }}

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed site bundle
        id: deployment
        uses: actions/deploy-pages@v4
