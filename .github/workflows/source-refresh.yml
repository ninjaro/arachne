name: Wikidata bulk source refresh

on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the configured refresh cadence
        required: false
        type: boolean
        default: false
      dump_url:
        description: Reviewed official Wikidata entity-dump URL
        required: false
        type: string
        default: https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.bz2

permissions:
  contents: read

concurrency:
  group: arachne-data-write
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.ARACHNE_OPERATIONS_ENABLED == 'true'
    runs-on: ${{ vars.ARACHNE_HPC_RUNNER_LABEL || vars.ARACHNE_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Mint the dedicated arachne-data writer token
        id: data-writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ARACHNE_DATA_WRITER_APP_ID }}
          private-key: ${{ secrets.ARACHNE_DATA_WRITER_APP_PRIVATE_KEY }}
          owner: ninjaro
          repositories: arachne-data
          permission-contents: write
          permission-pull-requests: write
      - name: Require persistent-state settings
        env:
          STATE_REPOSITORY: ${{ vars.ARACHNE_STATE_REPOSITORY }}
        run: |
          test -n "${STATE_REPOSITORY}"
      - name: Checkout protected persistent state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.ARACHNE_STATE_REPOSITORY }}
          ref: main
          token: ${{ steps.data-writer.outputs.token }}
          path: .arachne/ci-state
          fetch-depth: 0
          lfs: true
      - name: Validate selected code and authoritative state
        run: |
          if ! python3 scripts/state_manifest.py check \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state"; then
            python3 scripts/state_manifest.py check-product \
              --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state"
          fi
      - name: Evaluate configured source cadence
        id: cadence
        env:
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          arguments=()
          if [[ "${FORCE_REFRESH}" == "true" ]]; then
            arguments+=(--force)
          fi
          python3 scripts/source_refresh_gate.py gate \
            --config "${GITHUB_WORKSPACE}/.arachne/ci-state/config/arachne.json" \
            --marker "${GITHUB_WORKSPACE}/.arachne/ci-state/operations/source-refresh/wikidata.json" \
            --github-output "${GITHUB_OUTPUT}" \
            "${arguments[@]}"
      - name: Install application dependencies
        if: steps.cadence.outputs.due == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lbzip2 \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            nlohmann-json3-dev
      - name: Build Arachne operations binary
        if: steps.cadence.outputs.due == 'true'
        env:
          ARACHNE_BUILD_TESTS: "OFF"
        run: scripts/build.sh
      - name: Stage provider product input and materialize its snapshot
        if: steps.cadence.outputs.due == 'true'
        run: |
          python3 "${GITHUB_WORKSPACE}/.arachne/ci-state/scripts/prepare_provider_rebuild.py" \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --arachne-root "${GITHUB_WORKSPACE}"
          python3 scripts/materialize_ci_config.py \
            --template "${GITHUB_WORKSPACE}/.arachne/ci-state/config/arachne.json" \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --runner-temp "${RUNNER_TEMP}" \
            --output "${RUNNER_TEMP}/arachne-config.json"
          python3 scripts/materialize_local_product_snapshot.py \
            --database "${GITHUB_WORKSPACE}/.arachne/ci-state/.arachne/provider-rebuild/art-islands.sqlite" \
            --graph-store "${RUNNER_TEMP}/product-graph" \
            --output-control "${RUNNER_TEMP}/product-graph/active.json"
          echo "PRODUCT_CONTROL=${RUNNER_TEMP}/product-graph/active.json" >> "${GITHUB_ENV}"
          echo "REFRESH_ID=wikidata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          echo "FETCH_PLAN=${RUNNER_TEMP}/wikidata-fetch-plan.json" >> "${GITHUB_ENV}"
          echo "FETCH_CONTROLS=${RUNNER_TEMP}/wikidata-fetch-controls" >> "${GITHUB_ENV}"
          echo "FETCH_REQUEST=${RUNNER_TEMP}/wikidata-fetch-controls/wikidata-official-dump.json" >> "${GITHUB_ENV}"
          echo "SOURCE_CONTROL=${RUNNER_TEMP}/wikidata-source.acquired.json" >> "${GITHUB_ENV}"
          echo "RESULT_DIRECTORY=${RUNNER_TEMP}/wikidata-results" >> "${GITHUB_ENV}"
          echo "EXTERNAL_GRAPH=${RUNNER_TEMP}/wikidata-results/provider-observations.sqlite" >> "${GITHUB_ENV}"
          echo "IMAGE_HINTS=${RUNNER_TEMP}/wikidata-results/wikidata-image-hints.json" >> "${GITHUB_ENV}"
          echo "HPC_REPORT=${RUNNER_TEMP}/wikidata-results/wikidata-hpc-report.json" >> "${GITHUB_ENV}"
          echo "PROVIDER_REPORT=${RUNNER_TEMP}/provider-rebuild-report.json" >> "${GITHUB_ENV}"
          echo "STAGED_PRODUCT=${GITHUB_WORKSPACE}/.arachne/ci-state/.arachne/provider-rebuild/art-islands.sqlite" >> "${GITHUB_ENV}"
      - name: Declare and translate official bulk acquisition
        if: steps.cadence.outputs.due == 'true'
        env:
          DUMP_URL: ${{ inputs.dump_url || 'https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.bz2' }}
        run: |
          python3 scripts/wikidata_bulk_fetch_plan.py \
            --url "${DUMP_URL}" \
            --plan-id "${REFRESH_ID}" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "${FETCH_PLAN}"
          "${GITHUB_WORKSPACE}/build/arachne" fetch plan \
            --config "${RUNNER_TEMP}/arachne-config.json" \
            --plan "${FETCH_PLAN}" \
            --output-directory "${FETCH_CONTROLS}"
      - name: Acquire raw dump through Pheidippides
        id: acquire
        if: steps.cadence.outputs.due == 'true'
        continue-on-error: true
        run: |
          "${GITHUB_WORKSPACE}/build/arachne" fetch \
            --config "${RUNNER_TEMP}/arachne-config.json" \
            --request "${FETCH_REQUEST}" \
            --output-control "${SOURCE_CONTROL}"
      - name: Stream the acquired source
        id: stream
        if: steps.acquire.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -u hpc/wikidata/build_external_graph.py \
            --config "${RUNNER_TEMP}/arachne-config.json" \
            --source-control "${SOURCE_CONTROL}" \
            --product-snapshot-control "${PRODUCT_CONTROL}" \
            --output-directory "${RESULT_DIRECTORY}" \
            --work-directory "${RUNNER_TEMP}/wikidata-work" \
            --wikidata-config hpc/wikidata/config.json \
            --decompress-threads "$(nproc)"
      - name: Materialize and activate the provider product
        id: materialize
        if: steps.stream.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/materialize_provider_rebuild.py \
            --graph "${EXTERNAL_GRAPH}" \
            --database "${STAGED_PRODUCT}" \
            --priority "${GITHUB_WORKSPACE}/.arachne/ci-state/priority.json" \
            --report "${PROVIDER_REPORT}"
          python3 scripts/check_product_database_clean.py "${STAGED_PRODUCT}"
          python3 "${GITHUB_WORKSPACE}/.arachne/ci-state/scripts/activate_provider_product.py" \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --staged-database "${STAGED_PRODUCT}" \
            --schema "${GITHUB_WORKSPACE}/schema/product.sql"
          python3 scripts/state_manifest.py refresh \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --producer-commit "${GITHUB_SHA}"
          python3 scripts/state_manifest.py check \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state"
      - name: Preserve source and algorithm diagnostics
        if: steps.cadence.outputs.due == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wikidata-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SOURCE_CONTROL }}
            ${{ env.HPC_REPORT }}
            ${{ env.IMAGE_HINTS }}
            ${{ env.PROVIDER_REPORT }}
          if-no-files-found: warn
          retention-days: 14
      - name: Stop after acquisition, streaming, or materialization failure
        if: >-
          steps.cadence.outputs.due == 'true' &&
          (steps.acquire.outcome != 'success' ||
           steps.stream.outcome != 'success' ||
           steps.materialize.outcome != 'success')
        run: exit 1
      - name: Remove disposable provider artifacts
        if: steps.cadence.outputs.due == 'true'
        run: |
          python3 -c 'import json,os; d=json.load(open(os.environ["SOURCE_CONTROL"])); print("SOURCE_ID=" + d["artifact_id"]); print("SOURCE_SHA=" + d["artifact"]["sha256"])' >> "${GITHUB_ENV}"
          python3 scripts/discard_acquired_artifact.py \
            --fetch-request "${FETCH_REQUEST}" \
            --acquired-control "${SOURCE_CONTROL}" \
            --config "${RUNNER_TEMP}/arachne-config.json"
          rm -f "${EXTERNAL_GRAPH}"
          rm -f "${IMAGE_HINTS}"
          rm -f "${GITHUB_WORKSPACE}/.arachne/ci-state/derived/wikidata-image-hints.json"
      - name: Persist source cadence and propose reviewed source metadata
        if: steps.cadence.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ steps.data-writer.outputs.token }}
          STATE_REPOSITORY: ${{ vars.ARACHNE_STATE_REPOSITORY }}
        run: |
          python3 scripts/source_refresh_gate.py record \
            --marker "${GITHUB_WORKSPACE}/.arachne/ci-state/operations/source-refresh/wikidata.json" \
            --snapshot-id "${SOURCE_ID}" \
            --source-sha256 "${SOURCE_SHA}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/propose_state_change.py \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --repository "${STATE_REPOSITORY}" \
            --base main \
            --branch "arachne/wikidata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --title "Arachne Wikidata provider product refresh" \
            --body "Provider product materialization from ${SOURCE_ID}. Review transport evidence, the HPC report, provider report, canonical product, remaining priority IDs, and cadence metadata before merge."
