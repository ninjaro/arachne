name: Arachne maintainer dispatch

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to dispatch through the reviewed workflow
        required: true
        type: choice
        options:
          - cocoon-decision
          - product-integration
          - candidate-rebuild
      envelope_id:
        description: Cocoon ID for an explicit approval or rejection
        required: false
        type: string
      cocoon_decision:
        description: Human decision for the selected cocoon
        required: false
        type: choice
        options:
          - accepted
          - rejected
        default: accepted
      decision_reason:
        description: Auditable reason for the cocoon decision
        required: false
        type: string
      plan_mode:
        description: Candidate plan mode
        required: false
        type: choice
        options:
          - prebuilt
          - generate
        default: prebuilt
      run_id:
        description: Candidate rebuild run ID
        required: false
        type: string
      plan_control:
        description: Prebuilt candidate plan control in the state repository
        required: false
        type: string
      external_graph:
        description: External graph JSON for generated planning
        required: false
        type: string

permissions:
  contents: read

jobs:
  cocoon-decision:
    if: inputs.operation == 'cocoon-decision'
    runs-on: ${{ vars.ARACHNE_RUNNER_LABEL || 'ubuntu-latest' }}
    concurrency:
      group: arachne-data-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Mint the dedicated arachne-data writer token
        id: data-writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ARACHNE_DATA_WRITER_APP_ID }}
          private-key: ${{ secrets.ARACHNE_DATA_WRITER_APP_PRIVATE_KEY }}
          owner: ninjaro
          repositories: arachne-data
          permission-contents: write
      - name: Require decision and persistent-state settings
        env:
          ENVELOPE_ID: ${{ inputs.envelope_id }}
          DECISION_REASON: ${{ inputs.decision_reason }}
          STATE_REPOSITORY: ${{ vars.ARACHNE_STATE_REPOSITORY }}
        run: |
          test -n "${ENVELOPE_ID}"
          test -n "${DECISION_REASON}"
          test -n "${STATE_REPOSITORY}"
      - name: Checkout protected persistent state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.ARACHNE_STATE_REPOSITORY }}
          ref: main
          token: ${{ steps.data-writer.outputs.token }}
          path: .arachne/ci-state
          fetch-depth: 0
          lfs: true
      - name: Capture and validate the exact writer base
        run: |
          state_base="$(git -C .arachne/ci-state rev-parse HEAD)"
          test "${state_base}" = "$(git -C .arachne/ci-state rev-parse origin/main)"
          echo "ARACHNE_STATE_BASE=${state_base}" >> "${GITHUB_ENV}"
          python3 scripts/state_manifest.py check \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state"
      - name: Install application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            nlohmann-json3-dev
      - name: Build Arachne operations binary
        env:
          ARACHNE_BUILD_TESTS: "OFF"
          ARACHNE_BUILD_LEGACY_CLIENT: "OFF"
        run: scripts/build.sh
      - name: Record explicit human decision
        env:
          ENVELOPE_ID: ${{ inputs.envelope_id }}
          COCOON_DECISION: ${{ inputs.cocoon_decision }}
          DECISION_REASON: ${{ inputs.decision_reason }}
          DECISION_ACTOR: github:${{ github.actor }}
        run: |
          python3 scripts/materialize_ci_config.py \
            --template "${GITHUB_WORKSPACE}/.arachne/ci-state/config/arachne.json" \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --runner-temp "${RUNNER_TEMP}" \
            --output "${RUNNER_TEMP}/arachne-config.json"
          python3 scripts/arachne_ops.py \
            --config "${RUNNER_TEMP}/arachne-config.json" \
            --binary "${GITHUB_WORKSPACE}/build/arachne" \
            cocoon-transition \
            --envelope-id "${ENVELOPE_ID}" \
            --to "${COCOON_DECISION}" \
            --actor-ref "${DECISION_ACTOR}" \
            --reason "${DECISION_REASON}"
      - name: Publish serialized approval state
        env:
          ENVELOPE_ID: ${{ inputs.envelope_id }}
          COCOON_DECISION: ${{ inputs.cocoon_decision }}
        run: |
          python3 scripts/publish_state_repository.py \
            --state-root "${GITHUB_WORKSPACE}/.arachne/ci-state" \
            --expected-base "${ARACHNE_STATE_BASE}" \
            --base main \
            --title "Arachne ${COCOON_DECISION} ${ENVELOPE_ID}" \
            --allow queue \
            --allow operations/ledger.sqlite3

  product-integration:
    if: inputs.operation == 'product-integration'
    uses: ./.github/workflows/product-integration.yml
    secrets: inherit

  candidate-rebuild:
    if: inputs.operation == 'candidate-rebuild'
    uses: ./.github/workflows/candidate-rebuild.yml
    with:
      plan_mode: ${{ inputs.plan_mode }}
      plan_control: ${{ inputs.plan_control }}
      external_graph: ${{ inputs.external_graph }}
      run_id: ${{ inputs.run_id }}
    secrets: inherit
