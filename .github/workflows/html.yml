name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.hpp'
      - 'tests/**'
      - 'scripts/compact_merge_hints.py'
      - 'scripts/patch_doxygen_pages.py'
      - 'viewer/**'
      - 'database/art-islands.sqlite'
      - 'database/merge-hints-review.json'
      - 'docs/**'
      - 'readme.md'
      - 'Doxyfile'
      - 'CMakeLists.txt'
      - '.github/workflows/html.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - uses: MarkusJx/googletest-installer@28c5d4102d9d57b46254be19a940bf038a9c850a
      - uses: ssciwr/doxygen-install@501e53b879da7648ab392ee226f5b90e42148449
        with:
          version: "1.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install documentation and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            graphviz \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            nlohmann-json3-dev

      - name: Generate Doxygen
        run: doxygen Doxyfile

      - name: Build coverage report
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/arachne-%p.profraw
        run: |
          cmake -S . -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTS=ON \
            -DBUILD_LEGACY_CLIENT=OFF \
            -DCOVERAGE=ON
          cmake --build build-coverage --target core_tests --parallel
          ctest --test-dir build-coverage --output-on-failure
          llvm-profdata merge -sparse \
            "${RUNNER_TEMP}"/arachne-*.profraw \
            -o "${RUNNER_TEMP}/arachne.profdata"
          llvm-cov show build-coverage/core_tests \
            -instr-profile="${RUNNER_TEMP}/arachne.profdata" \
            -format=html \
            -output-dir=cov \
            -ignore-filename-regex='/(tests|build-coverage|usr)/'

      - name: Build static viewer
        working-directory: viewer
        run: |
          npm ci
          npm run data
          npm run build

      - name: Install viewer into Pages site
        run: |
          rm -rf doc/viewer
          mkdir -p doc/viewer
          cp -a viewer/dist/. doc/viewer/

      - name: Install coverage report
        run: |
          test -f cov/index.html
          rm -rf doc/cov
          cp -a cov doc/cov

      - name: Link standalone sites from Doxygen
        run: python3 scripts/patch_doxygen_pages.py doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
