name: Documentation and coverage

on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.hpp'
      - 'tests/**'
      - 'docs/**'
      - 'readme.md'
      - 'Doxyfile'
      - 'CMakeLists.txt'
      - '.github/workflows/html.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arachne-documentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: MarkusJx/googletest-installer@28c5d4102d9d57b46254be19a940bf038a9c850a
      - uses: ssciwr/doxygen-install@501e53b879da7648ab392ee226f5b90e42148449
        with:
          version: "1.15.0"

      - name: Install documentation and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            graphviz \
            libcxxopts-dev \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            nlohmann-json3-dev

      - name: Generate Doxygen
        run: doxygen Doxyfile

      - name: Build coverage report
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/arachne-%p.profraw
        run: |
          cmake -S . -B build-coverage \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTS=ON \
            -DBUILD_LEGACY_CLIENT=OFF \
            -DCOVERAGE=ON
          cmake --build build-coverage --target core_tests arachne_app --parallel
          ctest --test-dir build-coverage --output-on-failure
          llvm-profdata merge -sparse \
            "${RUNNER_TEMP}"/arachne-*.profraw \
            -o "${RUNNER_TEMP}/arachne.profdata"
          llvm-cov show build-coverage/core_tests \
            -instr-profile="${RUNNER_TEMP}/arachne.profdata" \
            -format=html \
            -output-dir=cov \
            -ignore-filename-regex='/(tests|build-coverage|usr)/'

      - name: Upload results to Codecov
        if: ${{ hashFiles('build/coverage.info') != '' }}
        uses: codecov/codecov-action@9b6d1f84bde660b0f784003009b1f0aa4663cdeb
        continue-on-error: true
        with:
          files: build/coverage.info
          fail_ci_if_error: false
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Bundle code documentation and coverage
        run: |
          test -f cov/index.html
          mkdir -p doc/cov
          cp -a cov/. doc/cov/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arachne-code-documentation
          path: doc
          if-no-files-found: error
          retention-days: 14
