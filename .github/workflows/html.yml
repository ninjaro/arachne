name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.hpp'
      - 'tests/**'
      - 'scripts/compact_merge_hints.py'
      - 'viewer/**'
      - 'database/art-islands.sqlite'
      - 'database/merge-hints-review.json'
      - 'docs/**'
      - 'readme.md'
      - 'Doxyfile'
      - 'CMakeLists.txt'
      - '.github/workflows/html.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - uses: ssciwr/doxygen-install@501e53b879da7648ab392ee226f5b90e42148449
        with:
          version: "1.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Generate Doxygen
        run: doxygen Doxyfile

      - name: Build static viewer
        working-directory: viewer
        run: |
          npm ci
          npm run data
          npm run build

      - name: Install viewer into Pages site
        run: |
          rm -rf doc/viewer
          mkdir -p doc/viewer
          cp -a viewer/dist/. doc/viewer/

      - name: Install coverage status page
        run: |
          if [[ -d cov ]]; then
            rm -rf doc/cov
            cp -a cov doc/cov
          elif [[ ! -f doc/cov/index.html ]]; then
            mkdir -p doc/cov
            cat > doc/cov/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Coverage unavailable</title>
            </head>
            <body>
              <main>
                <h1>Coverage report unavailable</h1>
                <p>The current Pages build did not produce a coverage report.</p>
              </main>
            </body>
          </html>
          EOF
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
