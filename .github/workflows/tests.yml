name: Checks

on:
  pull_request:
    branches:
      - master
      - docs
  push:
    branches:
      - 'renovate/**'
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.hpp'
      - 'tests/**/*.cpp'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'hpc/**/*.py'
      - 'hpc/**/*.json'
      - 'contracts/**/*.json'
      - 'config/**/*.json'
      - 'CMakeLists.txt'
      - '.github/workflows/*.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: MarkusJx/googletest-installer@28c5d4102d9d57b46254be19a940bf038a9c850a

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcxxopts-dev \
            nlohmann-json3-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            libcurl4-openssl-dev

      - name: Configure project
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON

      - name: Build project
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clang-format
        uses: jidicula/clang-format-action@bea9eaa8d410adcbb81b5a7a4d459b7bf4f83247
        with:
          clang-format-version: '21'
          check-path: '.'
