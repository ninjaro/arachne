name: Checks

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/**/*.cpp'
      - 'include/**/*.hpp'
      - 'tests/**/*.cpp'
      - 'tests/**/*.py'
      - 'scripts/**/*.py'
      - 'viewer/**'
      - 'database/merge-hint-decisions.json'
      - 'hpc/**/*.py'
      - 'hpc/**/*.json'
      - 'contracts/**/*.json'
      - 'config/**/*.json'
      - 'CMakeLists.txt'
      - '.github/workflows/*.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: MarkusJx/googletest-installer@28c5d4102d9d57b46254be19a940bf038a9c850a

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcxxopts-dev \
            nlohmann-json3-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            libcurl4-openssl-dev

      - name: Configure project
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON

      - name: Build project
        run: cmake --build build --parallel

      - name: Validate fixed product inbox
        run: build/arachne product check-inbox

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install native projection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcxxopts-dev \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libutf8proc-dev \
            nlohmann-json3-dev
      - name: Build native projection CLI
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF
          cmake --build build --target arachne_app --parallel
      - name: Build generated viewer
        working-directory: viewer
        run: |
          npm ci
          npm run data
          npm run build

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clang-format
        uses: jidicula/clang-format-action@bea9eaa8d410adcbb81b5a7a4d459b7bf4f83247
        with:
          clang-format-version: '21'
          check-path: '.'
