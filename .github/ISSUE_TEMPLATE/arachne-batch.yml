name: Arachne product batch
description: Submit one strict arachne_batch_v2 JSON file for review.
title: "[Arachne batch] "
labels:
  - arachne-batch
body:
  - type: markdown
    attributes:
      value: |
        Attach one plain UTF-8 `.json` file whose root format is
        `arachne_batch_v2`. ZIPs, sidecars, legacy batch types, and arbitrary
        metadata are not accepted. Use the issue title for a short description;
        no local command-line setup is required.

        The current contributor group is trusted, but mechanical receipt still
        does not certify factual or semantic correctness. You remain responsible
        for research, identity decisions, sources, quotations, weights, and
        confidence.

        Receipt does not mean database integration succeeded. The batch is checked
        before application, and rejected operations remain available for
        correction. Do not attach secrets or private source archives.

  - type: textarea
    id: batch_file
    attributes:
      label: Batch file
      description: Drag exactly one arachne_batch_v2 `.json` file into this field.
      placeholder: Drag one batch file here; GitHub will insert an attachment link.
    validations:
      required: true
